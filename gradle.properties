org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
# 编译 OOM 修复（2026-06-20·多 session 并发 + 冷全量编译）：让 Kotlin 编译跑进程内、用上面 Gradle daemon
# 的 6g 堆，避免各 session 间共享/抢用默认小堆的独立 Kotlin daemon 实例导致 GC overhead OOM。
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# KSP2 默认（2026-06 依赖升级期复核·已删显式开关）：早期 KSP 1.0.x（格式 2.0.21-1.0.28·KSP1 为默认后端）下，
# Room 2.8.4 的 schema 导出（改用 kotlinx-serialization）会崩 FieldBundle$$serializer typeParametersSerializers()
# AbstractMethodError（旧版 serialization 污染处理器类路径），当时靠 ksp.useKSP2=true 强制 v2 后端规避。
# 升级到 KSP 2.3.9（新 decoupled KSP·KSP2 原生）后实测：移除该 flag → Room schema 字节不变 + 全量单测过 + 0 警告
# （KSP2 已是默认后端），故不再需要显式 ksp.useKSP2。

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
